<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도전! 골든벨 보건퀴즈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page-bg:#E9E4D4;
  --page-ink:#3A3226;
  /* 칠판 슬라이드 고유 색: 골든벨 PPT와 같게 라이트/다크 모두 유지 */
  --board:#548C33;
  --board-deep:#41722A;
  --gold-1:#F3D27A;
  --gold-2:#B88A2E;
  --panel:#C4D8A8;
  --panel-ink:#1F2A16;
  --cream:#F4F4E6;
  --q-ink:#FFF4BE;
  --ink:#2A2A22;
  --orange:#F7A535;
  --orange-edge:#7A4A12;
  --o-blue:#4767D6;
  --x-red:#E2554B;
  --c1:#EE7B5B; --c2:#F0B42F; --c3:#38AE93; --c4:#3D8DDB;
  --bubble:#86C2E6;
  --white:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --page-bg:#14170F; --page-ink:#E8E4D6; }
}
:root[data-theme="dark"]{ color-scheme:dark; --page-bg:#14170F; --page-ink:#E8E4D6; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page-bg);color:var(--page-ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#scaler{position:relative}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;
  background:var(--board);border-radius:6px;
  box-shadow:0 0 0 14px var(--gold-2),0 0 0 18px var(--gold-1),0 18px 40px rgba(0,0,0,.35);
  overflow:hidden;color:var(--ink)}
#stage::before{content:"";position:absolute;inset:10px;border:3px solid rgba(243,210,122,.55);border-radius:4px;pointer-events:none}
.screen{position:absolute;inset:0;padding:34px 46px}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--q-ink);outline-offset:3px}
.btn{font-size:30px;padding:14px 30px;border-radius:999px;background:var(--cream);color:var(--ink);border:3px solid var(--orange-edge);box-shadow:0 5px 0 var(--orange-edge);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-edge)}
.btn.primary{background:var(--orange)}
.btn.small{font-size:22px;padding:8px 18px;border-width:2px;box-shadow:0 3px 0 var(--orange-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--q-ink);font-size:20px;padding:6px 12px;border-radius:10px;border:2px solid rgba(255,244,190,.5)}
.pts{position:absolute;right:46px;top:30px;background:var(--orange);color:var(--ink);font-size:34px;padding:6px 26px;border-radius:999px;border:3px solid var(--orange-edge);box-shadow:0 4px 0 var(--orange-edge)}
.pts.two{background:#FF6F4F;color:var(--white)}
.qhead{display:flex;gap:22px;align-items:flex-start;padding-right:170px}
.qnum{flex:none;width:76px;height:76px;border-radius:50%;background:var(--c2);border:5px solid var(--cream);display:grid;place-items:center;font-size:42px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.qtext{font-size:46px;line-height:1.35;color:var(--q-ink);margin:2px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.25);word-break:keep-all}
.blank{display:inline-block;width:150px;height:52px;vertical-align:-10px;background:var(--cream);border-radius:10px;margin:0 6px;border:3px solid var(--q-ink)}
.hint{display:inline-block;margin-top:14px;font-size:30px;color:var(--ink);background:var(--q-ink);padding:4px 18px;border-radius:12px}
.col{position:absolute;left:46px;right:46px;top:30px;bottom:110px;display:flex;flex-direction:column;gap:18px}
.qbody{flex:1;min-height:0;display:flex;gap:30px}
.qtext.long{font-size:38px}
.qtext.mini{font-size:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qtext.mini .blank{width:90px;height:34px;vertical-align:-6px}
.qmain{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center}
.opts{display:flex;flex-direction:column;gap:20px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:22px;background:var(--cream);border-radius:999px;padding:12px 36px 12px 14px;font-size:36px;color:var(--ink);word-break:keep-all;line-height:1.25}
.opt .n{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--white);font-size:38px}
.opt:nth-child(1) .n{background:var(--c1)}.opt:nth-child(2) .n{background:var(--c2)}.opt:nth-child(3) .n{background:var(--c3)}.opt:nth-child(4) .n{background:var(--c4)}
.opt.right{outline:6px solid var(--q-ink);background:var(--white)}
.opt.dim{opacity:.4}
.ox{display:flex;align-items:center;justify-content:center;gap:60px}
.oxmark{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;font-size:150px;color:var(--white);box-shadow:0 8px 0 rgba(0,0,0,.2);font-family:"Noto Sans KR",sans-serif;font-weight:700}
.oxmark.o{background:var(--o-blue)}.oxmark.x{background:var(--x-red)}
.ox img{height:380px}
.short{display:flex;align-items:center;justify-content:center;gap:40px}
.bubble{position:relative;background:var(--bubble);border-radius:50%;width:520px;height:250px;display:grid;place-items:center;text-align:center;font-size:38px;line-height:1.4;color:var(--ink)}
.bubble::after{content:"";position:absolute;right:-26px;top:120px;border:30px solid transparent;border-left:50px solid var(--bubble);transform:rotate(20deg)}
.short img{height:420px}
.timer{flex:none;width:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.ring{position:relative;width:250px;height:250px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;color:var(--q-ink)}
.ring.urgent .num{color:#FFD0C9}
.timeup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);background:var(--x-red);color:var(--white);font-size:64px;padding:24px 60px;border-radius:24px;border:6px solid var(--white);box-shadow:0 10px 0 rgba(0,0,0,.25);white-space:nowrap;animation:pop .35s ease-out;z-index:5}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-4deg) scale(.6);opacity:0}to{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.timeup{animation:none}}
.foot{position:absolute;left:46px;right:46px;bottom:30px;height:66px;display:flex;align-items:center;gap:14px}
.foot .grow{flex:1}
.prog{font-size:26px;color:var(--q-ink)}
.dots{display:flex;gap:6px;margin-left:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,244,190,.3)}
.dots i.done{background:var(--q-ink)}.dots i.now{background:var(--orange);box-shadow:0 0 0 3px var(--q-ink)}
/* 정답 화면 */
.ans{flex:none;height:280px;position:relative;background:var(--panel);border-radius:8px;display:flex;align-items:center;gap:30px;padding:20px 40px;
  -webkit-mask: radial-gradient(circle 9px at 50% 0,transparent 98%,#000) 0 0/26px 100% repeat-x;}
.stamp{flex:none;position:relative;width:200px;height:110px;display:grid;place-items:center;font-size:44px;color:#C83A2E}
.stamp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ansbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.answer{font-size:88px;color:var(--panel-ink);line-height:1.15;word-break:keep-all}
.answer.mid{font-size:64px}
.answer .alt{display:block;font-size:30px;margin-top:6px;color:#3B4A2B}
.answer .oxmark{width:150px;height:150px;font-size:104px;margin:0 auto}
.expl{display:flex;align-items:center;gap:14px;font-family:"Noto Sans KR",sans-serif;font-size:24px;line-height:1.5;color:var(--panel-ink);max-width:1100px;text-align:left;word-break:keep-all}
.expl img{height:64px;flex:none}
.status{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.status-h{display:flex;align-items:center;gap:14px;color:var(--q-ink);font-size:30px}
.tally{background:rgba(0,0,0,.18);padding:4px 16px;border-radius:999px;font-size:26px}
.tally b{font-weight:400;color:var(--white)}
.grid{flex:1;display:grid;gap:12px;grid-auto-rows:1fr;min-height:0}
.tile{position:relative;border-radius:16px;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border:4px solid transparent;min-height:0;overflow:hidden}
.tile .nm{font-size:30px;line-height:1.1;word-break:keep-all;text-align:center}
.tile .mk{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:34px;line-height:1}
.tile .sc{font-size:20px;color:#5A5440}
.tile.on{border-color:var(--o-blue);background:#E7ECFF}
.tile.on .mk{color:var(--o-blue)}
.tile.off .mk{color:var(--x-red)}
.tile.off{background:#F4E9E6}
.tile .gain{position:absolute;right:8px;top:6px;font-size:18px;color:var(--white);background:var(--o-blue);border-radius:999px;padding:1px 9px}
/* 점수 현황 */
.title{font-size:54px;color:var(--q-ink);margin:0;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{font-size:26px;color:var(--q-ink);opacity:.85;margin:4px 0 0}
.board{position:absolute;left:46px;right:46px;top:150px;bottom:110px;display:grid;gap:10px 40px;grid-auto-flow:column}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:0 16px;min-height:0}
.rk{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--cream);color:var(--ink)}
.rk.r1{background:#F6CF4A}.rk.r2{background:#D9DEE6}.rk.r3{background:#E7A86C}
.row .nm{flex:none;width:170px;font-size:32px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:26px;background:rgba(0,0,0,.2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--q-ink);border-radius:999px;transition:width .6s ease}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.row .pt{flex:none;width:96px;text-align:right;font-size:34px;color:var(--q-ink)}
.row .dl{flex:none;width:62px;font-size:22px;color:var(--white);text-align:center}
.row .dl.plus{background:var(--o-blue);border-radius:999px}
/* 시작 화면 */
.setup{display:flex;gap:40px}
.brand{width:700px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.brand .t1{height:80px;align-self:flex-start;margin-left:90px}
.brand .t2{height:140px;margin-top:6px}
.brand .t3{height:92px;margin-top:10px}
.brand .band{margin-top:10px;background:#42CB93;padding:8px 40px;transform:skewX(-12deg)}
.brand .band img{height:44px;transform:skewX(12deg);display:block}
.rules{margin-top:26px;background:#F3BDB4;border-radius:28px;padding:18px 30px;width:640px;color:var(--ink);font-family:"Noto Sans KR",sans-serif;font-size:21px;line-height:1.6}
.rules h3{margin:0 0 6px;font-family:"Jua",sans-serif;font-weight:400;font-size:28px;text-align:center}
.rules ol{margin:0;padding-left:26px}
.rules em{font-style:normal;color:#C0392B;font-weight:700}
.reg{flex:1;background:var(--cream);border-radius:28px;padding:28px 30px;display:flex;flex-direction:column;gap:16px;min-width:0}
.reg h2{margin:0;font-weight:400;font-size:40px}
.reg p{margin:0;font-family:"Noto Sans KR",sans-serif;font-size:19px;color:#5A5440;line-height:1.5}
.addrow{display:flex;gap:10px}
.addrow input{flex:1;min-width:0;font-family:"Noto Sans KR",sans-serif;font-size:28px;padding:10px 18px;border-radius:14px;border:3px solid #CFC9AE;background:var(--white);color:var(--ink)}
.chips{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;overflow:auto;min-height:0;padding:4px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 8px 6px 18px;font-size:26px;color:var(--panel-ink)}
.chip button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.12);font-size:22px;color:var(--panel-ink);font-family:"Noto Sans KR",sans-serif}
.empty{font-family:"Noto Sans KR",sans-serif;font-size:20px;color:#8A836B;padding:10px 4px}
.warn{font-family:"Noto Sans KR",sans-serif;font-size:18px;color:#B03A2E;min-height:26px}
.regfoot{display:flex;align-items:center;gap:16px}
.regfoot .cnt{flex:1;font-size:30px}
/* 최종 */
.final .ribbon{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:var(--gold-1);color:var(--ink);font-size:48px;padding:6px 70px;border:4px solid var(--gold-2);border-radius:14px;box-shadow:0 6px 0 var(--gold-2);white-space:nowrap}
.podium{position:absolute;left:46px;width:860px;top:160px;bottom:110px;display:flex;align-items:flex-end;justify-content:center;gap:18px}
.step{width:270px;display:flex;flex-direction:column;align-items:center}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;text-align:center}
.who .names{font-size:40px;color:var(--white);line-height:1.15;word-break:keep-all;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.who .sc{font-size:30px;color:var(--q-ink)}
.who .tie{font-size:20px;background:var(--x-red);color:var(--white);padding:2px 12px;border-radius:999px}
.who img.crown{height:90px}
.block{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:64px;color:var(--ink);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.b1{height:250px;background:#F6CF4A}.b2{height:180px;background:#E3E7EE}.b3{height:130px;background:#E9AE73}
.laurel{position:absolute;bottom:130px;height:300px;opacity:.9}
.laurel.l{left:60px}.laurel.r{right:0;transform:scaleX(-1)}
.allist{position:absolute;right:46px;width:600px;top:150px;bottom:110px;background:rgba(0,0,0,.18);border-radius:20px;padding:16px 18px;display:grid;gap:6px;grid-auto-rows:1fr;grid-auto-flow:column;column-gap:34px}
.lr{display:flex;align-items:center;gap:12px;color:var(--white);font-size:28px;min-height:0}
.lr .rk{width:42px;height:42px;font-size:22px}
.lr .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .pt{color:var(--q-ink)}
.lr.below{opacity:.7}
.note{position:absolute;left:46px;width:860px;top:112px;text-align:center;color:var(--q-ink);font-family:"Noto Sans KR",sans-serif;font-size:20px}
/* 결과표 */
.overlay{position:absolute;inset:0;background:var(--board-deep);z-index:20;padding:34px 46px;display:flex;flex-direction:column;gap:16px}
.tablewrap{flex:1;overflow:auto;background:var(--cream);border-radius:16px}
table{border-collapse:collapse;width:100%;font-family:"Noto Sans KR",sans-serif;font-size:20px;color:var(--ink)}
th,td{border:1px solid #D9D3BA;padding:6px 4px;text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:#E6E0C6;font-weight:700}
th small{display:block;font-weight:400;font-size:14px;color:#6A6450}
td.nm{text-align:left;padding-left:12px;font-weight:700}
td.o{color:var(--o-blue);font-weight:700}td.x{color:var(--x-red)}
td.tot{font-weight:700;background:#FFF4BE}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 실시간 버전 추가 스타일 */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:60px}
.card{background:var(--cream);border-radius:28px;padding:34px 44px;color:var(--ink)}
.msg{font-size:40px;color:var(--q-ink);line-height:1.4;word-break:keep-all;margin:0}
.msg.small{font-size:28px}
.code{font-size:150px;letter-spacing:.12em;color:var(--q-ink);line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.joinurl{font-family:"Noto Sans KR",sans-serif;font-size:28px;background:var(--cream);color:var(--ink);padding:10px 26px;border-radius:14px;word-break:break-all;max-width:1400px}
.lobby{position:absolute;inset:34px 46px 110px;display:flex;gap:40px}
.lobby .left{width:620px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.lobby .right{flex:1;background:var(--cream);border-radius:28px;padding:26px 30px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lobby h2{margin:0;font-weight:400;font-size:40px}
.lbl{font-size:30px;color:var(--q-ink)}
.subcount{position:absolute;left:46px;top:6px;background:rgba(0,0,0,.25);color:var(--white);font-size:26px;padding:4px 18px;border-radius:999px}
.tile .said{font-family:"Noto Sans KR",sans-serif;font-size:18px;color:#3d3a2c;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.06);padding:1px 8px;border-radius:8px}
.tile .said.none{color:#9a927a}
.form{display:flex;flex-direction:column;gap:16px;width:720px}
.form label{font-size:30px;text-align:left;color:var(--ink)}
.form input{font-family:"Noto Sans KR",sans-serif;font-size:36px;padding:12px 20px;border-radius:16px;border:3px solid #CFC9AE;background:var(--white);color:var(--ink)}
.err{font-family:"Noto Sans KR",sans-serif;font-size:22px;color:#B03A2E;min-height:30px}
.pick{display:flex;gap:30px;justify-content:center}
.pick button{width:240px;height:240px;border-radius:50%;font-size:150px;color:var(--white);font-family:"Noto Sans KR",sans-serif;font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.25);border:8px solid transparent}
.pick .po{background:var(--o-blue)}.pick .px{background:var(--x-red)}
.pick button.sel{border-color:var(--q-ink);transform:scale(1.06)}
.pick button:disabled{opacity:.45;cursor:not-allowed}
.opts.btns .opt{cursor:pointer;border:5px solid transparent;width:100%;text-align:left;font-family:inherit}
.opts.btns .opt.sel{border-color:var(--orange);background:var(--white)}
.opts.btns .opt:disabled{cursor:not-allowed;opacity:.6}
.write{display:flex;flex-direction:column;align-items:center;gap:18px}
.write input{width:760px;font-family:"Noto Sans KR",sans-serif;font-size:48px;padding:16px 26px;border-radius:20px;border:4px solid var(--q-ink);background:var(--white);color:var(--ink);text-align:center}
.saved{font-size:28px;color:var(--q-ink);min-height:40px}
.result{font-size:110px;line-height:1.1;margin:0}
.result.ok{color:var(--q-ink)}.result.no{color:#FFD0C9}
.big{font-size:64px;color:var(--white)}
.me{background:rgba(255,255,255,.28)!important;outline:4px solid var(--q-ink)}
.cfgwarn{font-family:"Noto Sans KR",sans-serif;font-size:24px;line-height:1.7;text-align:left;color:var(--ink)}
.cfgwarn code{background:#E6E0C6;padding:2px 8px;border-radius:6px}
.pill{display:inline-block;background:rgba(0,0,0,.22);color:var(--white);padding:6px 20px;border-radius:999px;font-size:26px}
</style>
</head>
<body>
<div id="viewport"><div id="scaler"><div id="stage" role="application" aria-label="골든벨 보건퀴즈"></div></div></div>
<div class="sr" aria-live="polite" id="live"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  const uid = cred.user.uid, db = firebase.database();
  let off=0; db.ref(".info/serverTimeOffset").on("value",s=>{ off=s.val()||0; });
  return {
    uid, now:()=>Date.now()+off,
    on:(p,cb)=>{ const r=db.ref(p); const h=r.on("value",s=>cb(s.val()),e=>console.warn(e)); return ()=>r.off("value",h); },
    get:p=>db.ref(p).get().then(s=>s.val()),
    set:(p,v)=>db.ref(p).set(v), update:(p,v)=>db.ref(p).update(v), remove:p=>db.ref(p).remove(),
    stamp: firebase.database.ServerValue.TIMESTAMP
  };
}
function initDemo(){
  const KEY="gb-demo-db"; const bc=("BroadcastChannel" in window)?new BroadcastChannel("gb-demo"):null;
  let uid=sessionStorage.getItem("gb-demo-uid"); if(!uid){ uid="u"+Math.random().toString(36).slice(2,9); sessionStorage.setItem("gb-demo-uid",uid); }
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const subs=new Set();
  const getAt=(t,p)=>p.split("/").filter(Boolean).reduce((o,k)=>(o==null||o[k]===undefined)?null:o[k],t);
  const setAt=(t,p,v)=>{ const ks=p.split("/").filter(Boolean); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const k=ks[ks.length-1]; if(v==null) delete o[k]; else o[k]=v; };
  const fix=v=>JSON.parse(JSON.stringify(v),(k,x)=>(x&&typeof x==="object"&&x[".sv"]==="timestamp")?Date.now():x);
  const fire=()=>{ const t=read(); subs.forEach(s=>s.cb(getAt(t,s.p))); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} if(bc) bc.postMessage(1); fire(); };
  if(bc) bc.onmessage=fire; addEventListener("storage",e=>{ if(e.key===KEY) fire(); });
  return {
    uid, now:()=>Date.now(),
    on:(p,cb)=>{ const s={p,cb}; subs.add(s); setTimeout(()=>cb(getAt(read(),p)),0); return ()=>subs.delete(s); },
    get:async p=>getAt(read(),p),
    set:async(p,v)=>{ const t=read(); setAt(t,p,fix(v)); write(t); },
    update:async(p,o)=>{ const t=read(); for(const k in o) setAt(t,p+"/"+k,fix(o[k])); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    stamp:{".sv":"timestamp"}
  };
}

/* ---------- 채점 ---------- */
function norm(v){ return String(v==null?"":v).toLowerCase().replace(/[\s.,!?~()\[\]{}'"“”‘’·\-_/]/g,""); }
function autoGrade(q,v){
  if(v==null||v==="") return false;
  if(q.t==="ox") return String(v).toUpperCase()===q.a;
  if(q.t==="mc") return String(v)===String(q.a);
  const n=norm(v);
  if(q.check==="cpr") return /등/.test(n)&&/(두드|두들|치기|때리|쳐)/.test(n)&&/(복부|배)/.test(n)&&/밀/.test(n);
  return (q.ok||[]).some(a=>n===norm(a));
}
function answerLabel(q,v){
  if(v==null||v==="") return "";
  if(q.t==="mc") return NUMS[+v-1]||String(v);
  return String(v);
}

/* ---------- 점수 ---------- */
function playersOf(r){ const p=(r&&r.players)||{}; return Object.keys(p).map(id=>({id,name:p[id].name,joinedAt:p[id].joinedAt||0})).sort((a,b)=>a.joinedAt-b.joinedAt||a.id.localeCompare(b.id)); }
function right(r,i,id){ return !!(r&&r.grades&&r.grades[qk(i)]&&r.grades[qk(i)][id]===true); }
function scoreUpTo(r,id,last){ let s=0; for(let i=0;i<=last;i++) if(right(r,i,id)) s+=Q[i].p; return s; }
function ranked(r,last){
  const rows=playersOf(r).map(p=>({...p,score:scoreUpTo(r,p.id,last),gain:right(r,last,p.id)?Q[last].p:0}));
  rows.sort((a,b)=>b.score-a.score||a.joinedAt-b.joinedAt);
  rows.forEach((x,i)=>{ x.rank=(i>0&&rows[i-1].score===x.score)?rows[i-1].rank:i+1; });
  return rows;
}
function podiumGroups(rows){
  const g=[]; rows.filter(r=>r.score>=10&&r.rank<=3).forEach(r=>{ let x=g.find(y=>y.rank===r.rank); if(!x){ x={rank:r.rank,score:r.score,names:[]}; g.push(x);} x.names.push(r.name); }); return g;
}

function ptsBadge(q){ return '<div class="pts'+(q.p>1?' two':'')+'">'+q.p+'점</div>'; }
function dots(idx){ return '<div class="dots" aria-hidden="true">'+Q.map((_,i)=>'<i class="'+(i<idx?'done':i===idx?'now':'')+'"></i>').join("")+'</div>'; }
function qHead(q,i,mini){ return '<div class="qhead"><div class="qnum">'+(i+1)+'</div><div><p class="qtext'+(mini?' mini':(q.q.length>80?' long':''))+'">'+qText(q)+'</p>'+(!mini&&q.hint?'<span class="hint">'+esc(q.hint).replace(/\[ \]/g,"[  ]")+'</span>':'')+'</div></div>'; }
function ringHTML(){ return '<div class="ring" id="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="10"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--q-ink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="num" id="tnum">'+SECONDS+'</div></div>'; }
function setRing(left){

function finalPodium(rows){
  const g=podiumGroups(rows);
  const step=(x,cls,lab)=>'<div class="step">'+(x?'<div class="who">'+(cls==="b1"?'<img class="crown" src="'+IMG.crown+'" alt="">':'')+'<span class="names">'+x.names.map(esc).join("<br>")+'</span><span class="sc">'+x.score+'점</span>'+(x.names.length>1?'<span class="tie">동점</span>':'')+'</div>':'<div class="who"><span class="sc">해당 없음</span></div>')+'<div class="block '+cls+'">'+(x?x.rank+'등':lab)+'</div></div>';
  return {html:'<div class="podium">'+step(g[1],"b2","2등")+step(g[0],"b1","1등")+step(g[2],"b3","3등")+'</div>', tie:g.some(x=>x.names.length>1), any:rows.some(r=>r.score>=10)};

/* ---------- 타이머 루프 ---------- */
function loop(){
  cancelAnimationFrame(raf);
  const st=ROOM&&ROOM.state; if(!st||st.phase!=="question") return;
  let last=null;
  const step=()=>{
    const s=ROOM&&ROOM.state; if(!s||s.phase!=="question") return;
    const left=(s.startAt+SECONDS*1000-API.now())/1000;
    setRing(left);
    const sh=Math.ceil(left);
    if(sh<=3&&sh>0&&last!==sh){ last=sh; beep(660,.15); }
    if(left<=0){
      if(IS_TEACHER){ if(API.now()>=s.startAt+SECONDS*1000+GRACE && closingFor!==s.qkey){ closingFor=s.qkey; beep(440,.6); API.update("rooms/"+CODE+"/state",{phase:"closed"}); return; } }
      else { onStudentTimeUp(); return; }
    }
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

async function tCreate(){
  let code=null;
  for(let i=0;i<15;i++){ const c=String(Math.floor(1000+Math.random()*9000)); const ex=await API.get("rooms/"+c); if(!ex){ code=c; break; } }
  if(!code){ tHome("방 코드를 만들지 못했어요. 다시 눌러 주세요."); return; }
  await API.set("rooms/"+code,{host:API.uid,createdAt:API.stamp,state:{phase:"lobby",idx:0,qkey:"q0"}});
  try{ localStorage.setItem("gb-teacher-room",code); }catch(e){}
  tWatch(code);
}
function tWatch(code){
  CODE=code; if(unsub) unsub();
  unsub=API.on("rooms/"+code,r=>{ ROOM=r; if(!r){ try{localStorage.removeItem("gb-teacher-room");}catch(e){} } tRender(); });
}
async function tAction(a,el){
  const base="rooms/"+CODE, st=(ROOM&&ROOM.state)||{}, idx=st.idx||0;
  if(a==="create") return tCreate();
  if(a==="kick") return API.remove(base+"/players/"+el.dataset.id);
  if(a==="copy"){ try{ await navigator.clipboard.writeText(joinURL()); el.textContent="복사했어요"; }catch(e){ el.textContent="복사가 안 돼요. 주소를 직접 알려 주세요"; } return; }
  if(a==="start") return API.update(base+"/state",{phase:"show",idx:0,qkey:"q0"});
  if(a==="go"){ closingFor=null; const now=API.now(); return API.update(base+"/state",{phase:"question",startAt:now,deadline:now+SECONDS*1000+GRACE}); }
  if(a==="reveal"){
    cancelAnimationFrame(raf);
    const q=Q[idx], ans=(ROOM.answers&&ROOM.answers[qk(idx)])||{}, old=(ROOM.grades&&ROOM.grades[qk(idx)])||{}, upd={};
    playersOf(ROOM).forEach(p=>{ if(old[p.id]===undefined) upd["grades/"+qk(idx)+"/"+p.id]=autoGrade(q,ans[p.id]&&ans[p.id].v); });
    upd["state/phase"]="reveal";
    return API.update(base,upd);
  }
  if(a==="mark"){ const id=el.dataset.id, cur=right(ROOM,idx,id); return API.set(base+"/grades/"+qk(idx)+"/"+id,!cur); }
  if(a==="board") return API.update(base+"/state",{phase:idx===Q.length-1?"final":"board"});
  if(a==="toreveal"){ showTable=false; return API.update(base+"/state",{phase:"reveal",idx:Math.min(idx,Q.length-1)}); }
  if(a==="next"){ if(idx<Q.length-1) return API.update(base+"/state",{phase:"show",idx:idx+1,qkey:qk(idx+1)}); return API.update(base+"/state",{phase:"final"}); }
  if(a==="table"){ showTable=!showTable; return tRender(); }
  if(a==="closeroom"){ if(confirm("방을 닫고 이 골든벨 기록(학생 이름, 답, 점수)을 모두 지울까요? 지우기 전에 결과표를 확인하거나 사진으로 남겨 두세요.")){ await API.remove(base); try{localStorage.removeItem("gb-teacher-room");}catch(e){} if(unsub) unsub(); ROOM=null; CODE=null; tHome(); } }
}

/* =========================================================
   학생 화면
   ========================================================= */
let me={name:null}, myDraft="", saveTimer=0, lastQ=null, joinErr="";
function sJoin(){
  const pre=params.get("room")||"";
  stage.innerHTML='<div class="screen"><div class="center" style="gap:18px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+titleArt()+'</div>'+
   '<div class="card"><div class="form"><label for="rc">방 코드 (선생님 화면의 숫자 4개)</label><input id="rc" inputmode="numeric" maxlength="4" value="'+esc(pre)+'" autocomplete="off">'+
   '<label for="nm">내 이름</label><input id="nm" maxlength="10" autocomplete="off" placeholder="이름을 쓰세요">'+
   '<div class="err" id="err">'+esc(joinErr)+'</div><button class="btn primary" data-act="join">참가하기</button></div></div></div></div>';
  const rc=document.getElementById("rc"), nm=document.getElementById("nm");
  (pre?nm:rc).focus();
  [rc,nm].forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); sDoJoin(); } }));
}
async function sDoJoin(){
  const code=document.getElementById("rc").value.trim(), name=document.getElementById("nm").value.trim();
  const err=m=>{ joinErr=m; document.getElementById("err").textContent=m; };
  if(!/^\d{4}$/.test(code)) return err("방 코드는 숫자 4개예요. 선생님 화면을 다시 확인해 주세요.");
  if(!name) return err("이름을 써 주세요.");
  const room=await API.get("rooms/"+code);
  if(!room) return err("그 방 코드는 없어요. 숫자를 다시 확인해 주세요.");
  if(playersOf(room).some(p=>p.name===name&&p.id!==API.uid)) return err("같은 이름이 이미 있어요. 이름 뒤에 번호를 붙여 주세요. (예: "+name+"2)");
  try{ await API.set("rooms/"+code+"/players/"+API.uid,{name,joinedAt:API.stamp}); }
  catch(e){ return err("참가하지 못했어요. 잠시 뒤 다시 눌러 주세요."); }
  joinErr=""; try{ localStorage.setItem("gb-student-room",code); }catch(e){}
  sWatch(code);
}
function sWatch(code){
  CODE=code; if(unsub) unsub();
  let joined=false;
  unsub=API.on("rooms/"+code,r=>{
    ROOM=r;
    const mine=r&&r.players&&r.players[API.uid];
    if(!r){ joinErr="골든벨이 끝났어요. 수고했어요!"; if(unsub) unsub(); ROOM=null; return sJoin(); }
    if(!mine){ if(joined){ joinErr="참가가 취소됐어요. 이름을 다시 써서 참가해 주세요."; if(unsub) unsub(); ROOM=null; return sJoin(); } return; }
    joined=true; me.name=mine.name; sRender();
  });
}
function myAnswer(i){ const a=ROOM&&ROOM.answers&&ROOM.answers[qk(i)]&&ROOM.answers[qk(i)][API.uid]; return a?a.v:null; }
function sFoot(idx){ return '<div class="foot"><span class="prog">'+esc(me.name)+'</span>'+(idx!=null?dots(idx):'')+'<span class="grow"></span><span class="prog">'+(idx!=null?'문제 '+(idx+1)+' / '+Q.length:'방 '+esc(CODE))+'</span></div>'; }
function sRender(){
  const st=ROOM.state||{phase:"lobby",idx:0}, idx=st.idx||0, q=Q[idx];
  if(lastQ!==st.qkey){ lastQ=st.qkey; myDraft=""; }
  const focused=document.activeElement&&document.activeElement.id==="wr";
  if(st.phase==="question"&&q.t==="short"&&focused&&document.getElementById("wr")){ updateSaved(); return; } // 입력 중에는 화면을 다시 그리지 않아요
  if(st.phase==="lobby"){
    stage.innerHTML='<div class="screen"><div class="center"><p class="result ok">참가 완료!</p><p class="big">'+esc(me.name)+'</p><p class="msg">선생님이 시작할 때까지 기다려 주세요.</p><span class="pill">지금 '+playersOf(ROOM).length+'명 참가</span></div>'+sFoot(null)+'</div>'; return;
  }
  if(st.phase==="show"||st.phase==="question"||st.phase==="closed"){
    const open=st.phase==="question"&&API.now()<st.deadline;
    const mine=myAnswer(idx);
    let input;
    if(q.t==="ox") input='<div class="pick"><button class="po'+(mine==="O"?' sel':'')+'" data-act="ans" data-v="O" '+(open?'':'disabled')+' aria-label="O">O</button><button class="px'+(mine==="X"?' sel':'')+'" data-act="ans" data-v="X" '+(open?'':'disabled')+' aria-label="X">X</button></div>';
    else if(q.t==="mc") input='<div class="opts btns">'+q.o.map((o,i)=>'<button class="opt'+(String(mine)===String(i+1)?' sel':'')+'" data-act="ans" data-v="'+(i+1)+'" '+(open?'':'disabled')+'><span class="n">'+(i+1)+'</span><span>'+esc(o)+'</span></button>').join("")+'</div>';
    else input='<div class="write"><input id="wr" maxlength="40" autocomplete="off" placeholder="'+(open?'여기에 답을 쓰세요':'')+'" value="'+esc(myDraft||mine||"")+'" '+(open?'':'disabled')+'><button class="btn primary" data-act="sendw" '+(open?'':'disabled')+'>제출하기</button></div>';
    const status = st.phase==="show" ? '선생님이 10초 시작을 누르면 답을 낼 수 있어요.'
                 : open ? '' : (mine!=null?'시간 끝! 내 답: '+esc(answerLabel(q,mine)):'시간 끝! 답을 내지 않았어요.');
    stage.innerHTML='<div class="screen">'+ptsBadge(q)+'<div class="col">'+qHead(q,idx,q.q.length>60)+
      '<div class="qbody"><div class="qmain" style="align-items:center">'+input+'<div class="saved" id="saved">'+status+'</div></div>'+
      '<div class="timer">'+ringHTML()+'</div></div></div>'+sFoot(idx)+'</div>';
    if(st.phase==="question"&&open){ loop(); updateSaved(); const w=document.getElementById("wr"); if(w){ w.focus(); w.addEventListener("input",()=>{ myDraft=w.value; clearTimeout(saveTimer); saveTimer=setTimeout(()=>sSubmit(w.value),500); }); w.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); sSubmit(w.value); } }); } }
    else setRing(st.phase==="show"?SECONDS:0);
    return;
  }
  if(st.phase==="reveal"){
    const g=ROOM.grades&&ROOM.grades[qk(idx)]; const ok=g&&g[API.uid]===true, mine=myAnswer(idx);
    stage.innerHTML='<div class="screen">'+ptsBadge(q)+'<div class="col">'+qHead(q,idx,true)+revealAnswerHTML(q)+
      '<div class="center" style="position:static;flex:1;padding:0;gap:10px">'+(g?'<p class="result '+(ok?'ok':'no')+'">'+(ok?'정답이에요! +'+q.p+'점':'아쉬워요!')+'</p>':'<p class="msg">채점 중이에요...</p>')+
      '<p class="msg small">내 답: '+(mine!=null?esc(answerLabel(q,mine)):'없음')+'　|　내 점수: '+scoreUpTo(ROOM,API.uid,idx)+'점</p></div></div>'+sFoot(idx)+'</div>';
    return;
  }
  if(st.phase==="board"||st.phase==="final"){
    const last=st.phase==="final"?Q.length-1:idx, rows=ranked(ROOM,last), mine=rows.find(r=>r.id===API.uid);
    if(st.phase==="board"){
      stage.innerHTML='<div class="screen"><div class="center"><p class="msg">'+(idx+1)+'번 문제까지 내 점수</p><p class="code" style="letter-spacing:0">'+(mine?mine.score:0)+'점</p><p class="msg">지금 '+(mine?mine.rank:'-')+'등 ('+rows.length+'명 중)</p><span class="pill">다음 문제를 기다려요</span></div>'+sFoot(idx)+'</div>';
    } else {
      const pd=finalPodium(rows);
      stage.innerHTML='<div class="screen final"><div class="ribbon">골든벨 끝!</div>'+pd.html+
        '<div class="allist" style="grid-template-rows:repeat(4,1fr);grid-auto-flow:row;padding:30px;text-align:center"><p class="msg">'+esc(me.name)+'의 최종 점수</p><p class="code" style="font-size:120px;letter-spacing:0">'+(mine?mine.score:0)+'점</p><p class="msg">'+(mine?mine.rank:'-')+'등 ('+rows.length+'명 중)</p><p class="msg small">'+TOTAL+'점 만점, 수고했어요!</p></div>'+sFoot(null)+'</div>';
    }
  }
}
function updateSaved(){
  const st=ROOM&&ROOM.state; if(!st) return; const el=document.getElementById("saved"); if(!el) return;
  const mine=myAnswer(st.idx||0); if(st.phase==="question") el.textContent=mine!=null?'제출됨: '+answerLabel(Q[st.idx||0],mine)+' (시간 안에는 바꿀 수 있어요)':'';
}
async function sSubmit(v){
  const st=ROOM&&ROOM.state; if(!st||st.phase!=="question") return;
  v=String(v==null?"":v).trim().slice(0,40); if(!v) return;
  if(API.now()>st.deadline){ const el=document.getElementById("saved"); if(el) el.textContent="시간이 지나서 제출되지 않았어요."; return; }
  try{ await API.set("rooms/"+CODE+"/answers/"+st.qkey+"/"+API.uid,{v,t:API.stamp}); }
  catch(e){ const el=document.getElementById("saved"); if(el) el.textContent="시간이 지나서 제출되지 않았어요."; }
}
function onStudentTimeUp(){
  const w=document.getElementById("wr"); if(w&&w.value.trim()&&w.value.trim()!==String(myAnswer(ROOM.state.idx)||"")) sSubmit(w.value);
  if(w) w.blur();
  document.querySelectorAll('[data-act="ans"],[data-act="sendw"],#wr').forEach(b=>b.disabled=true);
  const el=document.getElementById("saved"); if(el){ const m=myAnswer(ROOM.state.idx); el.textContent=m!=null?'시간 끝! 내 답: '+answerLabel(Q[ROOM.state.idx],m):'시간 끝!'; }
}

/* ---------- 이벤트 ---------- */
stage.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==="sound"){ sound=!sound; b.textContent=sound?'소리 켜짐':'소리 꺼짐'; return; }
  if(a==="full"){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(err){} return; }
  if(IS_TEACHER) return tAction(a,b);
  if(a==="join") return sDoJoin();
  if(a==="ans"){ document.querySelectorAll('[data-act="ans"]').forEach(x=>x.classList.toggle("sel",x===b)); return sSubmit(b.dataset.v); }
  if(a==="sendw"){ const w=document.getElementById("wr"); return sSubmit(w&&w.value); }
});
addEventListener("keydown",e=>{
  if(!IS_TEACHER||e.target.tagName==="INPUT") return;
  const st=ROOM&&ROOM.state; if(!st) return;
  if(e.key===" "&&st.phase==="show"){ e.preventDefault(); tAction("go"); }
  if(e.key==="Enter"&&st.phase==="closed"){ e.preventDefault(); tAction("reveal"); }
});

/* ---------- 시작 ---------- */
async function boot(){
  fit();
  const configured=FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL;
  if(!DEMO&&!configured){
    stage.innerHTML='<div class="screen"><div class="center"><div class="card cfgwarn"><b style="font-family:Jua,sans-serif;font-weight:400;font-size:36px">아직 Firebase 설정이 없어요</b><br>'+
      'index.html 파일 맨 위의 <code>FIREBASE_CONFIG</code> 안에 Firebase 설정을 붙여 넣어 주세요.'+(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.databaseURL?'<br><b>databaseURL</b> 줄이 빠져 있어요. Realtime Database 화면 위쪽의 주소(https://…firebasedatabase.app)를 <code>databaseURL: "주소",</code>로 추가해 주세요.':'')+
      '<br>설정 없이 한 컴퓨터에서 미리 보려면 주소 끝에 <code>?teacher&amp;demo</code>(선생님)와 <code>?demo</code>(학생, 다른 탭)를 붙여 보세요.</div></div></div>';
    return;
  }
  stage.innerHTML='<div class="screen"><div class="center"><p class="msg">연결하는 중이에요...</p></div></div>';
  try{ API=DEMO?initDemo():await initFirebase(); }
  catch(e){ stage.innerHTML='<div class="screen"><div class="center"><div class="card cfgwarn"><b>연결하지 못했어요</b><br>Firebase 설정과 익명 로그인 사용 설정을 확인해 주세요.<br><small>'+esc(e&&e.message)+'</small></div></div></div>'; return; }
  if(IS_TEACHER){
    let saved=null; try{ saved=localStorage.getItem("gb-teacher-room"); }catch(e){}
    if(saved){ const r=await API.get("rooms/"+saved); if(r&&r.host===API.uid) return tWatch(saved); }
    tHome();
  } else {
    let saved=null; try{ saved=localStorage.getItem("gb-student-room"); }catch(e){}
    const want=params.get("room")||saved;
    if(want){ const r=await API.get("rooms/"+want); if(r&&r.players&&r.players[API.uid]) return sWatch(want); }
    sJoin();
  }
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
boot();

</script>
